# Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Default database URL (overridden by env.py using ENVIOLATIONS_DB_PATH)
sqlalchemy.url = sqlite:///data/pipeline.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
